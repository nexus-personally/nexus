<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>港雀顶栏设计对照</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; padding: 12px; background: #1a201b; color: #f8e8c8; font: 14px sans-serif }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
  section { min-width: 0 }
  h2 { margin: 0 0 6px; font-size: 14px }
  .full { position: relative; width: 100%; overflow: hidden; background: #101c17 }
  .full { height: 345px }
  img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: top }
  iframe { display: block; width: 1280px; height: 720px; border: 0; transform: scale(.479); transform-origin: top left }
</style>
<main>
  <section><h2>选定设计 · 方案 2</h2><div class="full"><img src="./selected-option-2.png" alt="选定的顶栏设计"></div></section>
  <section><h2>本地实现 · 线上房间</h2><div class="full"><iframe src="/mahjong/" title="本地牌局"></iframe></div></section>
</main>
</html>

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_only
    ports:
      - "5432:5432"
    volumes:
      - nexus-postgres:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: nexus_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nexus-minio:/data

volumes:
  nexus-postgres:
  nexus-minio:

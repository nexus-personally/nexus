databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus

services:
  - type: web
    name: nexus
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERSISTENCE
        value: postgres
      - key: POSTGRES_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
